// ═══════════════════════════════════════════
// USUARIOS (Firebase Authentication + perfil en Firestore)
// Cada docente/directivo tiene SU PROPIA cuenta real (correo + clave).
// El rol (admin, rector, coordinacion, orientacion, docente) vive en
// Firestore, en usuarios/{uid}, y las reglas de seguridad lo verifican
// ahí para decidir qué puede leer o escribir cada quien.
// ═══════════════════════════════════════════
const USERS_COLLECTION = 'usuarios';

const usersStorage = {
  // Trae el perfil (rol, nombre, activo) del usuario autenticado
  async getProfile(uid){
    const snap = await db.collection(USERS_COLLECTION).doc(uid).get();
    return snap.exists ? {...snap.data(), uid} : null;
  },
  // Lista en tiempo real todos los usuarios (para el panel de administración)
  subscribe(onData, onError){
    return db.collection(USERS_COLLECTION).onSnapshot(
      snap => onData(snap.docs.map(d=>({...d.data(), uid:d.id}))),
      err => { console.error('Error listando usuarios:', err); onError && onError(err); }
    );
  },
  // Crea una cuenta nueva SIN cerrar la sesión del admin: usa una instancia
  // secundaria de Firebase solo para el alta, y la cierra al terminar.
  // El usuario se genera (inicial+apellido) y la contraseña inicial es la cédula;
  // el funcionario puede cambiarla después desde "Mi Información".
  async createUser({primerNombre, primerApellido, nombre, cedula, role, grado, grupo}){
    const doc=String(cedula||"").replace(/[^0-9A-Za-z]/g,"");
    if(doc.length<6) throw {code:"custom/cedula-corta",message:"La cédula debe tener al menos 6 caracteres."};
    const existentesSnap = await db.collection(USERS_COLLECTION).get();
    const existentes = new Set(existentesSnap.docs.map(d=>(d.data().email||"").toLowerCase()));
    const usuario = buildStaffUsername(primerNombre,primerApellido,existentes);
    const email = buildStaffEmail(usuario);

    const secondaryName = 'secondary-'+Date.now();
    const secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, secondaryName);
    try{
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, doc);
      const uid = cred.user.uid;
      await db.collection(USERS_COLLECTION).doc(uid).set({
        nombre: nombre.trim(), email, documento: doc, role, activo: true,
        grado: role==="docente" ? (grado||"") : "",
        grupo: role==="docente" ? (grupo||"") : "",
        creadoEn: new Date().toISOString()
      });
      await secondaryApp.auth().signOut();
      return {uid, email, password: doc};
    } finally {
      await secondaryApp.delete();
    }
  },
  // Cambia rol o estado activo/inactivo de un usuario (no borra la cuenta de Auth,
  // eso requeriría acceso al panel de Firebase o Cloud Functions)
  async updateUser(uid, changes){
    await db.collection(USERS_COLLECTION).doc(uid).update(changes);
  },
  async resendReset(email){
    await auth.sendPasswordResetEmail(email.trim().toLowerCase());
  },
  // Borra el perfil (documento en /usuarios) de una cuenta de estudiante para poder
  // volver a crearla. NO borra la cuenta de Firebase Auth en sí (eso requiere borrarla
  // a mano en la consola de Firebase, ver instrucciones en el botón "Restablecer cuenta").
  async deleteProfile(uid){
    await db.collection(USERS_COLLECTION).doc(uid).delete();
  }
};

// Crea cuentas de acceso para estudiantes en lote: usuario = inicial del primer nombre +
// primer apellido + últimos 4 dígitos del documento + "e", contraseña = número de documento.
// Usa una app secundaria de Firebase para no cerrar la sesión del admin. Salta a quienes
// ya tengan cuenta (AUTH_UID) o cuyo documento tenga menos de 6 caracteres (mínimo de Firebase).
async function crearUsuariosEstudiantes(lista){
  const resultado={creados:0,saltados:0,errores:[],limitados:0};
  if(!db||!auth) return resultado;
  const pendientes=lista.filter(s=>!s.AUTH_UID && s.NOMBRE1 && s.APELLIDO1 && s.NRO_DOCUMENTO);
  resultado.saltados = lista.length - pendientes.length;
  if(!pendientes.length) return resultado;

  // Trae los correos ya registrados para evitar colisiones de usuario
  const usadosSnap = await db.collection(USERS_COLLECTION).get();
  const usados = new Set(usadosSnap.docs.map(d=>(d.data().email||"").toLowerCase()));

  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  const secondaryName='secondary-'+Date.now();
  const secondaryApp=firebase.initializeApp(FIREBASE_CONFIG, secondaryName);
  try{
    for(const s of pendientes){
      const doc=String(s.NRO_DOCUMENTO||"").replace(/[^0-9A-Za-z]/g,"");
      if(doc.length<6){ resultado.errores.push({estudiante:`${s.NOMBRE1} ${s.APELLIDO1}`,motivo:"Documento con menos de 6 caracteres"}); continue; }
      const email=buildStudentEmail(s);
      if(usados.has(email.toLowerCase())){ resultado.errores.push({estudiante:`${s.NOMBRE1} ${s.APELLIDO1}`,motivo:`Usuario duplicado (${email})`}); continue; }

      let intentos=0, exito=false;
      while(intentos<2 && !exito){
        intentos++;
        try{
          const cred=await secondaryApp.auth().createUserWithEmailAndPassword(email, doc);
          const uid=cred.user.uid;
          await db.collection(USERS_COLLECTION).doc(uid).set({
            nombre:`${s.NOMBRE1} ${s.APELLIDO1}`.trim(), email, role:"estudiante", activo:true,
            estudianteId:s._id, documento:doc, creadoEn:new Date().toISOString()
          });
          await studentsStorage.updateFields(s._id,{AUTH_UID:uid, AUTH_EMAIL:email, AUTH_CREADO_EN:new Date().toISOString()});
          usados.add(email.toLowerCase());
          resultado.creados++;
          exito=true;
        }catch(e){
          const esLimite = e.code==="auth/too-many-requests" || /quota|too many/i.test(e.message||"");
          if(esLimite && intentos<2){
            resultado.limitados++;
            await sleep(8000); // espera y reintenta una vez más
            continue;
          }
          resultado.errores.push({estudiante:`${s.NOMBRE1} ${s.APELLIDO1}`,motivo:e.message||String(e)});
        }
      }
      await sleep(250); // evita ráfagas que disparen el límite de creación de cuentas de Firebase
    }
    await secondaryApp.auth().signOut();
  } finally {
    await secondaryApp.delete();
  }
  return resultado;
}

// Mapa por defecto de tipo de personal -> rol del sistema. El admin puede ajustar
// el rol de cada quien después en Gestión de Usuarios si no le queda el correcto.
const TIPO_PERSONAL_A_ROL = {
  "DOCENTE DE AULA":"docente",
  "DIRECTIVO DOCENTE":"coordinador",
  "ORIENTADORA":"orientacion",
  "DOCENTE ORIENTADORES":"orientacion",
  "ADMINISTRATIVO":"auxiliar"
};

// El campo "Nombres y apellidos" del personal viene como un solo texto. Partimos
// la primera mitad como nombre(s) y la segunda como apellido(s) -- es una
// aproximación (los nombres compuestos en español son ambiguos), por eso conviene
// revisar el usuario generado si algo no cuadra.
function partirNombreCompleto(nombreCompleto){
  const palabras=String(nombreCompleto||"").trim().split(/\s+/).filter(Boolean);
  if(!palabras.length) return {primerNombre:"",primerApellido:""};
  if(palabras.length===1) return {primerNombre:palabras[0],primerApellido:""};
  const nApellidos=Math.ceil(palabras.length/2);
  return {primerNombre:palabras[0], primerApellido:palabras[palabras.length-nApellidos]};
}

// Crea cuentas de acceso para el personal en lote: usuario = inicial del primer
// nombre + primer apellido, contraseña = cédula. Mismo patrón que estudiantes.
async function crearUsuariosPersonal(lista){
  const resultado={creados:0,saltados:0,errores:[],limitados:0};
  if(!db||!auth) return resultado;
  const pendientes=lista.filter(p=>!p.AUTH_UID && p.nombres && p.cedula);
  resultado.saltados = lista.length - pendientes.length;
  if(!pendientes.length) return resultado;

  const usadosSnap = await db.collection(USERS_COLLECTION).get();
  const usados = new Set(usadosSnap.docs.map(d=>(d.data().email||"").toLowerCase()));
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  const secondaryName='secondary-'+Date.now();
  const secondaryApp=firebase.initializeApp(FIREBASE_CONFIG, secondaryName);
  try{
    for(const p of pendientes){
      const doc=String(p.cedula||"").replace(/[^0-9A-Za-z]/g,"");
      if(doc.length<6){ resultado.errores.push({persona:p.nombres,motivo:"Cédula con menos de 6 caracteres"}); continue; }
      const {primerNombre,primerApellido}=partirNombreCompleto(p.nombres);
      if(!primerNombre||!primerApellido){ resultado.errores.push({persona:p.nombres,motivo:"No se pudo determinar nombre y apellido"}); continue; }
      const usuario=buildStaffUsername(primerNombre,primerApellido,usados);
      const email=buildStaffEmail(usuario);
      const rol=TIPO_PERSONAL_A_ROL[p.tipoPersonal]||"docente";

      let intentos=0, exito=false;
      while(intentos<2 && !exito){
        intentos++;
        try{
          const cred=await secondaryApp.auth().createUserWithEmailAndPassword(email, doc);
          const uid=cred.user.uid;
          await db.collection(USERS_COLLECTION).doc(uid).set({
            nombre:p.nombres, email, documento:doc, role:rol, activo:true,
            grado:"", grupo:"", personalId:p._id||doc, creadoEn:new Date().toISOString()
          });
          await personalStorage.updateFields(p._id||doc,{AUTH_UID:uid,AUTH_EMAIL:email});
          usados.add(email.toLowerCase());
          resultado.creados++;
          exito=true;
        }catch(e){
          const esLimite = e.code==="auth/too-many-requests" || /quota|too many/i.test(e.message||"");
          if(esLimite && intentos<2){ resultado.limitados++; await sleep(8000); continue; }
          resultado.errores.push({persona:p.nombres,motivo:e.message||String(e)});
        }
      }
      await sleep(250);
    }
    await secondaryApp.auth().signOut();
  } finally {
    await secondaryApp.delete();
  }
  return resultado;
}

// ═══════════════════════════════════════════
// ALMACENAMIENTO DE ESTUDIANTES (1 documento por estudiante)
// Antes: TODOS los estudiantes vivían en un único documento
// ("students-data") que cada docente reescribía completo al guardar.
// Eso causaba que, si dos docentes guardaban casi al mismo tiempo,
// el segundo sobrescribía el documento con SU copia desactualizada
// y borraba lo que el primero acababa de guardar.
// Ahora cada estudiante es su propio documento (doc.id = _id del
// estudiante) y la lista se sincroniza en tiempo real con onSnapshot,
// así que nunca se pisan entre docentes.
// ═══════════════════════════════════════════
const STUDENTS_COLLECTION = 'inedisav_estudiantes';
const LOCAL_FALLBACK_KEY = 'inedisav_students-data';
let _fallbackListeners = [];

function _readFallback(){
  try { const raw = localStorage.getItem(LOCAL_FALLBACK_KEY); return raw ? JSON.parse(raw) : []; }
  catch { return []; }
}
function _writeFallback(list){
  try { localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(list)); } catch(e){ console.error(e); }
  _fallbackListeners.forEach(fn=>fn(list));
}

async function migrateOldStudentsIfNeeded(){
  if(!db) return;
  try{
    const already = await db.collection(STUDENTS_COLLECTION).limit(1).get();
    if(!already.empty) return; // ya migrado, no tocar nada
    const old = await db.collection('inedisav').doc('students-data').get();
    if(!old.exists) return;
    const raw = old.data().value;
    const list = raw ? JSON.parse(raw) : [];
    if(!list.length) return;
    console.log(`Migrando ${list.length} estudiante(s) del formato antiguo...`);
    await studentsStorage.saveMany(list.map(s=>({...s,_id:s._id||`${Date.now()}_${Math.random().toString(36).slice(2)}`})));
    console.log('Migración completada. Los datos ahora viven en documentos individuales.');
  }catch(e){ console.error('Error migrando estudiantes:', e); }
}

const studentsStorage = {
  // Se suscribe a la lista de estudiantes. onData(list) se llama de inmediato
  // y cada vez que cambian los datos (por este navegador o por cualquier otro).
  // Devuelve una función para cancelar la suscripción.
  subscribe(onData, onError){
    if(db){
      return db.collection(STUDENTS_COLLECTION).onSnapshot(
        snap => onData(snap.docs.map(d => ({...d.data(), _id:d.id}))),
        err => { console.error('Error de sincronización Firestore:', err); onError && onError(err); }
      );
    }
    _fallbackListeners.push(onData);
    onData(_readFallback());
    return () => { _fallbackListeners = _fallbackListeners.filter(fn=>fn!==onData); };
  },
  // Guarda UN solo estudiante (nuevo o edición), sin tocar los demás
  async saveOne(student){
    const id = student._id || `${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const data = {...student, _id:id};
    if(db){ await db.collection(STUDENTS_COLLECTION).doc(id).set(data); }
    else {
      const list = _readFallback();
      const idx = list.findIndex(s=>s._id===id);
      if(idx>=0) list[idx]=data; else list.push(data);
      _writeFallback(list);
    }
    return data;
  },
  // Elimina UN solo estudiante, sin tocar los demás
  async deleteOne(id){
    if(db){ await db.collection(STUDENTS_COLLECTION).doc(id).delete(); }
    else { _writeFallback(_readFallback().filter(s=>s._id!==id)); }
  },
  // Guarda varios de un solo golpe (importación de Excel)
  async saveMany(students){
    if(db){
      for(let i=0;i<students.length;i+=450){
        const chunk = students.slice(i,i+450);
        const batch = db.batch();
        chunk.forEach(s=>{
          const id = s._id || `${Date.now()}_${Math.random().toString(36).slice(2)}`;
          batch.set(db.collection(STUDENTS_COLLECTION).doc(id), {...s,_id:id});
        });
        await batch.commit();
      }
    } else { _writeFallback([..._readFallback(), ...students]); }
  },
  // Borra toda la base (según la lista actual que tiene la pantalla)
  async clearAll(currentList){
    if(db){
      for(let i=0;i<currentList.length;i+=450){
        const chunk = currentList.slice(i,i+450);
        const batch = db.batch();
        chunk.forEach(s=> batch.delete(db.collection(STUDENTS_COLLECTION).doc(s._id)));
        await batch.commit();
      }
    } else { _writeFallback([]); }
  },
  // Se suscribe SOLO al estudiante cuya cuenta (AUTH_UID) coincide con el usuario autenticado.
  // Usado por el portal de estudiantes: nunca trae la colección completa.
  subscribeOwn(uid, onData, onError){
    if(!db){ onData(null); return ()=>{}; }
    return db.collection(STUDENTS_COLLECTION).where("AUTH_UID","==",uid).limit(1).onSnapshot(
      snap => onData(snap.empty ? null : {...snap.docs[0].data(), _id:snap.docs[0].id}),
      err => { console.error('Error cargando ficha del estudiante:', err); onError && onError(err); }
    );
  },
  // Actualiza solo los campos indicados (usado por el portal de estudiantes)
  async updateFields(id, patch){
    if(db){ await db.collection(STUDENTS_COLLECTION).doc(id).update(patch); }
  }
};

// MÓDULO DIRECTIVA (configuración académica base):
// períodos, áreas, asignaturas, asignaturas por grado, escala de valoración,
// criterios de convivencia y propósitos. Fábrica genérica de almacenamiento
// para no repetir el mismo CRUD 7 veces.
// ═══════════════════════════════════════════
function makeCrudStorage(collectionName){
  return {
    subscribe(onData,onError){
      if(!db){ onData([]); return ()=>{}; }
      return db.collection(collectionName).onSnapshot(
        snap=>onData(snap.docs.map(d=>({_id:d.id,...d.data()}))),
        err=>{ console.error(`Error listando ${collectionName}:`,err); onError&&onError(err); }
      );
    },
    async saveOne(data){
      if(!db) return;
      const id=data._id || db.collection(collectionName).doc().id;
      const {_id,...rest}=data;
      await db.collection(collectionName).doc(id).set(rest,{merge:true});
      return id;
    },
    async deleteOne(id){
      if(!db) return;
      await db.collection(collectionName).doc(id).delete();
    }
  };
}

const PERSONAL_COLLECTION = 'inedisav_personal';
const personalStorage = {
  subscribe(onData, onError){
    if(db){
      return db.collection(PERSONAL_COLLECTION).onSnapshot(
        snap => onData(snap.docs.map(d=>({...d.data(), _id:d.id}))),
        err => { console.error('Error listando personal:', err); onError && onError(err); }
      );
    }
    onData([]); return ()=>{};
  },
  async saveOne(persona){
    if(!db) return;
    const id=String(persona.cedula||persona._id||"").trim();
    if(!id) throw new Error("La cédula es obligatoria");
    const {_id, ...data}=persona;
    await db.collection(PERSONAL_COLLECTION).doc(id).set(data,{merge:false});
  },
  async saveMany(personas){
    if(!db) return;
    for(let i=0;i<personas.length;i+=450){
      const chunk=personas.slice(i,i+450);
      const batch=db.batch();
      chunk.forEach(p=>{
        const id=String(p.cedula||"").trim();
        if(id) batch.set(db.collection(PERSONAL_COLLECTION).doc(id), p);
      });
      await batch.commit();
    }
  },
  async deleteOne(id){
    if(!db) return;
    await db.collection(PERSONAL_COLLECTION).doc(id).delete();
  },
  async updateFields(id, patch){
    if(!db) return;
    await db.collection(PERSONAL_COLLECTION).doc(id).update(patch);
  }
};

const NOTAS_COLLECTION = 'inedisav_notas';
const CATEGORIAS_NOTA=[{id:"saber",label:"Saber"},{id:"saberHacer",label:"Saber Hacer"},{id:"ser",label:"Ser"}];
const PESOS_PERIODO=[0.30,0.30,0.40]; // Período 1, 2, 3

// Promedio de N1,N2,N3 dentro de una categoría (Saber / Saber Hacer / Ser)
function promedioCategoria(catObj){
  const vals=["n1","n2","n3"].map(k=>catObj?.[k]).filter(v=>v!==undefined&&v!==null&&v!=="").map(Number).filter(v=>!isNaN(v));
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
// Nota final del período = promedio simple de Saber, Saber Hacer y Ser (33.3% cada una)
function notaFinalPeriodo(notaEstudiante){
  const vals=CATEGORIAS_NOTA.map(c=>promedioCategoria(notaEstudiante?.[c.id])).filter(v=>v!==null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
// Nota final del año = P1×30% + P2×30% + P3×40% (solo con los períodos que ya tengan nota)
function notaFinalAnio(p1,p2,p3){
  const notas=[p1,p2,p3];
  let sumaPeso=0,sumaPonderada=0;
  notas.forEach((n,i)=>{ if(n!==null&&n!==undefined){ sumaPonderada+=n*PESOS_PERIODO[i]; sumaPeso+=PESOS_PERIODO[i]; } });
  if(sumaPeso===0) return null;
  return sumaPonderada/sumaPeso;
}
function idNotas(grado,grupo,periodo){ return `${grado}_${grupo||"unico"}_P${periodo}`; }
const notasStorage = {
  subscribe(grado,grupo,periodo,onData,onError){

    return db.collection(NOTAS_COLLECTION).doc(idNotas(grado,grupo,periodo)).onSnapshot(
      snap => onData(snap.exists ? snap.data() : {notas:{}}),
      err => { console.error('Error leyendo notas:', err); onError && onError(err); }
    );
  },
  async marcar(grado,grupo,periodo,estudianteId,categoria,indiceN,valor,usuario){
    if(!db) return;
    await db.collection(NOTAS_COLLECTION).doc(idNotas(grado,grupo,periodo)).set({
      grado,grupo:grupo||"",periodo,
      notas:{[estudianteId]:{[categoria]:{["n"+indiceN]:valor}}},
      actualizadoPor:usuario||"",actualizadoEn:new Date().toISOString()
    },{merge:true});
  },
  // Trae las notas de los 3 períodos de un grado/grupo (para el reporte consolidado)
  async getTodosPeriodos(grado,grupo){
    if(!db) return {1:{},2:{},3:{}};
    const docs=await Promise.all(["1","2","3"].map(p=>db.collection(NOTAS_COLLECTION).doc(idNotas(grado,grupo,p)).get()));
    const out={};
    docs.forEach((snap,i)=>{ out[i+1]=snap.exists?(snap.data().notas||{}):{}; });
    return out;
  }
};

const STUDENT_EMAIL_DOMAIN = "estudiante.inedisav.edu.co";
const STAFF_EMAIL_DOMAIN = "personal.inedisav.edu.co";
const STUDENT_EDITABLE_SECTION_IDS = ["personal","vivienda","historial","academico","familiar"];
// Campos que, aunque viven en una sección editable, los diligencia el colegio (no el estudiante):
// asistencia de la familia a reuniones/entrega de boletines.
const STUDENT_EXCLUDED_FIELD_IDS = ["ASISTE_REU_DIF_BOLETIN","ASISTE_ENTREGA_INFORMES"];
const STUDENT_EDITABLE_FIELD_IDS = FIELD_DEFS.filter(f=>STUDENT_EDITABLE_SECTION_IDS.includes(f.section) && !f.comisionField && !f.adminOnly && !STUDENT_EXCLUDED_FIELD_IDS.includes(f.id)).map(f=>f.id);

// Quita tildes y cualquier caracter que no sea letra, para usar en el usuario/correo
function _soloLetras(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z]/g,"").toLowerCase(); }

// inicial del primer nombre + primer apellido + últimos 4 dígitos del documento + "e"
function buildStudentUsername(s){
  const inicial=_soloLetras(s.NOMBRE1).slice(0,1);
  const apellido=_soloLetras(s.APELLIDO1);
  const doc=String(s.NRO_DOCUMENTO||"").replace(/[^0-9A-Za-z]/g,"");
  const ult4=doc.slice(-4);
  return `${inicial}${apellido}${ult4}e`;
}
function buildStudentEmail(s){ return `${buildStudentUsername(s)}@${STUDENT_EMAIL_DOMAIN}`; }

// usuario = inicial del primer nombre + primer apellido (ej. Juan Pérez -> jperez).
// Si ya existe (dos funcionarios con el mismo patrón), le agrega un número al final.
function buildStaffUsername(primerNombre,primerApellido,existentes){
  const base=_soloLetras(primerNombre).slice(0,1)+_soloLetras(primerApellido);
  let usuario=base, n=2;
  while(existentes.has(`${usuario}@${STAFF_EMAIL_DOMAIN}`.toLowerCase())){ usuario=base+n; n++; }
  return usuario;
}
function buildStaffEmail(usuario){ return `${usuario}@${STAFF_EMAIL_DOMAIN}`; }


function emptyStudent(){const o={};FIELD_DEFS.forEach(f=>{o[f.id]="";});o._id=null;o.ESTADO="MATRICULADO";return o;}
function riskCount(s){if(s.ESTADO==="RETIRADO")return -1;return RISK_FIELDS.filter(f=>s[f]==="S").length;}
function normalizeKey(k){return String(k||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\(.*?\)/g,"").replace(/ALT\s*\+?\s*124/g,"").replace(/[¿?]/g,"").replace(/[^A-Z0-9]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");}
const FIELD_KEY_MAP={};FIELD_DEFS.forEach(f=>{FIELD_KEY_MAP[normalizeKey(f.id)]=f.id;});
function countBy(arr,fid){
  const field=FIELD_DEFS.find(f=>f.id===fid);
  const opts=field&&field.type==="select"?field.options||[]:null;
  const c={};arr.forEach(s=>{let v=s[fid];if(!v)return;if(opts)v=matchVal(opts,v);c[v]=(c[v]||0)+1;});
  return Object.entries(c).map(([name,total])=>({name,total}));
}
function countMulti(arr,fids){const c={};arr.forEach(s=>{fids.forEach(f=>{(s[f]||"").split("|").filter(Boolean).forEach(v=>{c[v]=(c[v]||0)+1;});});});return Object.entries(c).map(([name,total])=>({name,total})).sort((a,b)=>b.total-a.total);}
function matchVal(opts,raw){
  if(!raw)return "";
  const tries=[raw,String(raw).padStart(2,"0"),String(raw).replace(/^0+/,"")];
  for(const t of tries){const f=opts.find(o=>(typeof o==="object"?o.value:o)===t);if(f)return typeof f==="object"?f.value:f;}
  // Coincidencia flexible: sin distinguir mayúsculas/minúsculas, tildes, puntos ni espacios extra
  // (útil para datos importados de Excel o texto libre guardado antes de que el campo fuera una lista)
  const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase().replace(/[.,]/g,"").replace(/\s+/g," ");
  const rawNorm=norm(raw);
  const flexible=opts.find(o=>norm(typeof o==="object"?o.value:o)===rawNorm);
  if(flexible) return typeof flexible==="object"?flexible.value:flexible;
  // Sin coincidencia alguna: no se deja el texto en minúscula, se formatea en Tipo Oración
  return String(raw).trim().toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
}
// Normaliza un valor según las reglas del campo: mayúsculas en texto/alfanumérico
// y coincidencia contra las opciones válidas en selects (ignora mayúsculas/espacios,
// útil para datos importados de Excel con distinta capitalización).
function normalizeFieldValue(field,raw){
  let v=String(raw??"").trim();
  if(!v) return v;
  if(field.validate==="alpha") v=v.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]/g,"").toUpperCase().replace(/\s+/g," ").trim();
  else if(field.validate==="alnum") v=v.replace(/[^A-Za-z0-9]/g,"").toUpperCase();
  else if(field.validate==="digits") v=v.replace(/[^0-9]/g,"");
  if((field.type==="select"||field.type==="dependent_select")&&(field.options||[]).length) v=matchVal(field.options,v);
  return v;
}
function resolveLabel(field,value){
  if(!value)return "—";
  if(field.type==="yesno")return value==="S"?"Sí":value==="N"?"No":value;
  if(field.type==="date"){try{return new Date(value+"T00:00:00").toLocaleDateString("es-CO");}catch{return value;}}
  const strip=l=>l&&l.includes(" - ")?l.split(" - ").slice(1).join(" - "):(l||value);
  if(field.type==="multicheck"){return (value||"").split("|").filter(Boolean).map(v=>{const tries=[v,String(v).padStart(2,"0"),String(v).replace(/^0+/,"")];let o;for(const t of tries){o=(field.options||[]).find(x=>(typeof x==="object"?x.value:x)===t);if(o)break;}if(!o)o=(field.options||[]).find(x=>(typeof x==="object"?x.label:x)===v);return strip(o?(typeof o==="object"?o.label:o):v);}).join(", ")||"—";}
  if(field.type==="select"){const opts=field.options||[];const tries=[value,String(value).padStart(2,"0"),String(value).replace(/^0+/,"")];let o;for(const t of tries){o=opts.find(x=>(typeof x==="object"?x.value:x)===t);if(o)break;}if(!o)o=opts.find(x=>(typeof x==="object"?x.label:x)===value);return strip(o?(typeof o==="object"?o.label:o):value);}
  return value;
}

// Abre el reporte directo en una pestaña nueva (con el botón de Imprimir ya visible),
// en vez de descargar un archivo que hay que ir a buscar y abrir aparte.
// Si el navegador bloquea la ventana emergente, cae de vuelta a la descarga de siempre.
function dlHtml(html,name){
  const w=window.open("","_blank");
  if(!w||w.closed||typeof w.closed==="undefined"){
    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    alert("Tu navegador bloqueó la ventana emergente, así que se descargó el archivo en su lugar. Ábrelo desde Descargas y usa el botón \"Imprimir\" de adentro.\n\nPara evitar esto la próxima vez, permite las ventanas emergentes de este sitio.");
    return;
  }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

    dias.forEach(d=>{
      const v=d.registros?.[s._id]||"";
      row[d.fecha]=v;
      if(v==="P")p++; else if(v==="A")a++; else if(v==="T")t++; else if(v==="E")e++;
    });
    const total=p+a+t+e;
    row.PRESENTES=p; row.AUSENTES=a; row.TARDES=t; row.EXCUSAS=e;
    row["% ASISTENCIA"]=total?Math.round((p/total)*100):"";

}

function FieldRenderer({field,value,onChange,parentValue,disabled,allowedOptions}){
  const wide=field.type==="textarea"||field.type==="multicheck";
  const ic="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white";
  const ro=opts=>opts.map(o=>{const v=typeof o==="object"?o.value:o;const l=typeof o==="object"?o.label:o;return h('option',{key:v,value:v},l);});

  if(disabled&&(field.adminOnly||field.comisionField)){
    return h('div',{className:wide?"md:col-span-2":""},
      h('label',{className:"block text-xs font-medium text-slate-500 mb-1"},field.label),
      h('div',{className:"w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-50 text-slate-600 flex items-center justify-between"},
        h('span',null,resolveLabel(field,value)),
        h('span',{className:"flex items-center gap-1 text-xs text-amber-600"},h(Icons.Lock),h('span',null,"Restringido"))
      )
    );
  }

  let input;
  const filterByValidate=(str,validate)=>{
    if(validate==="alpha") return str.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]/g,"").toUpperCase();
    if(validate==="digits") return str.replace(/[^0-9]/g,"");
    if(validate==="alnum") return str.replace(/[^A-Za-z0-9]/g,"").toUpperCase();
    return str;
  };
  if(field.type==="text") input=h('input',{type:"text",value:value||"",inputMode:field.validate==="digits"?"numeric":"text",onChange:e=>onChange(filterByValidate(e.target.value,field.validate)),className:ic});
  else if(field.type==="number") input=h('input',{type:"text",value:value||"",inputMode:"numeric",pattern:"[0-9]*",onChange:e=>onChange(e.target.value.replace(/[^0-9]/g,"")),onKeyDown:e=>{if(["e","E","+","-",".",","].includes(e.key))e.preventDefault();},onBlur:e=>{let n=e.target.value;if(n==="")return;let num=parseInt(n,10);if(field.min!=null&&num<field.min)onChange(String(field.min));else if(field.max!=null&&num>field.max)onChange(String(field.max));},className:ic});
  else if(field.type==="date") input=h('input',{type:"date",value:value||"",onChange:e=>onChange(e.target.value),className:ic});
  else if(field.type==="textarea") input=h('textarea',{value:value||"",onChange:e=>onChange(e.target.value),rows:3,className:ic});
  else if(field.type==="select"){
    let opts=field.options||[];
    if(allowedOptions) opts=opts.filter(o=>{const v=typeof o==="object"?o.value:o;return allowedOptions.includes(v)||v===value;});
    const nv=matchVal(opts,value);
    input=h('select',{value:nv,onChange:e=>onChange(e.target.value),className:ic},h('option',{value:""},"Seleccionar..."),ro(opts));
  }
  else if(field.type==="yesno") input=h('select',{value:value||"",onChange:e=>onChange(e.target.value),className:ic},h('option',{value:""},"Seleccionar..."),h('option',{value:"S"},"Sí"),h('option',{value:"N"},"No"));
  else if(field.type==="dependent_select"){
    if(!parentValue) input=h('p',{className:"text-xs text-slate-400 italic py-2"},"Seleccione primero la razón de deserción.");
    else if(!(CAUSAS_MAP[parentValue]||[]).length) input=h('p',{className:"text-xs text-slate-400 italic py-2"},"No hay causas para esta razón.");
    else input=h('select',{value:value||"",onChange:e=>onChange(e.target.value),className:ic},h('option',{value:""},"Seleccionar causa..."),ro(CAUSAS_MAP[parentValue]||[]));
  }
  else if(field.type==="multicheck"){
    input=h('div',{className:"flex flex-wrap gap-2"},(field.options||[]).map(o=>{
      const v=typeof o==="object"?o.value:o,l=typeof o==="object"?o.label:o;
      const sel=(value||"").split("|").filter(Boolean),chk=sel.includes(v);
      return h('label',{key:v,className:`flex items-center gap-1 px-2 py-1 rounded-lg border text-xs cursor-pointer ${chk?"bg-indigo-50 border-indigo-300 text-indigo-700":"border-slate-200 text-slate-600"}`},
        h('input',{type:"checkbox",className:"hidden",checked:chk,onChange:()=>{const n=chk?sel.filter(x=>x!==v):[...sel,v];onChange(n.join("|"));}}),l
      );
    }));
  }

  return h('div',{className:wide?"md:col-span-2":""},
    h('label',{className:"block text-xs font-medium text-slate-500 mb-1"},field.label),
    input
  );
}

function LoginScreen({onLogin}){
  const [email,setEmail]=useState(""),[pass,setPass]=useState(""),

  async function go(){
    if(!email.trim()||!pass){setError("Ingresa tu usuario (o correo) y la contraseña.");return;}
    setError("");setResetMsg("");setBusy(true);
    const escrito=email.trim().toLowerCase();

    // por la app (estudiante y personal) antes de rendirnos.

      `${escrito}@${STUDENT_EMAIL_DOMAIN}`,
      `${escrito}@${STAFF_EMAIL_DOMAIN}`
    ];
    let cred=null, lastErr=null;
    for(const correoIntento of candidatos){
      try{ cred = await auth.signInWithEmailAndPassword(correoIntento, pass); break; }
      catch(e){ lastErr=e; }
    }
    if(!cred){
      console.error(lastErr);
      registrarAuditoria(escrito,"","LOGIN_FALLIDO","Credenciales incorrectas o error: "+(lastErr?.code||lastErr?.message));

      setError(map[lastErr?.code]||"No se pudo iniciar sesión. Intenta de nuevo.");
      setBusy(false);return;
    }
    try{
      const profile = await usersStorage.getProfile(cred.user.uid);
      if(!profile || profile.activo===false){
        registrarAuditoria(escrito,"","LOGIN_FALLIDO","Cuenta no autorizada o desactivada");
        await auth.signOut();
        setError("Tu cuenta no está autorizada o fue desactivada. Contacta al administrador.");
        setBusy(false);return;
      }

      console.error(e);
      setError("No se pudo iniciar sesión. Intenta de nuevo.");
      setBusy(false);
    }

  async function forgotPass(){

    h('div',{className:"bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm"},

        h('div',{className:"bg-indigo-100 rounded-full p-3 mb-3"},h(Icons.Grad)),
        h('h1',{className:"text-xl font-bold text-slate-800"},"Caracterización Estudiantil"),
        h('p',{className:"text-sm text-slate-400 mt-1"},"INEDISAV - Ingresa tus credenciales")
      ),
      h('div',{className:"space-y-4"},
        h('div',null,h('label',{className:"block text-xs font-medium text-slate-500 mb-1"},"Usuario o correo"),h('input',{type:"text",autoCapitalize:"none",autoCorrect:"off",value:email,onChange:e=>setEmail(e.target.value),onKeyDown:e=>e.key==="Enter"&&go(),placeholder:"tu usuario o correo",className:"w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"})),
        h('div',null,h('label',{className:"block text-xs font-medium text-slate-500 mb-1"},"Contraseña"),
          h('div',{className:"relative"},
            h('input',{type:showPass?"text":"password",value:pass,onChange:e=>setPass(e.target.value),onKeyDown:e=>e.key==="Enter"&&go(),placeholder:"Contraseña",className:"w-full border border-slate-200 rounded-lg px-3 py-2 pr-16 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"}),
            h('button',{type:"button",onClick:()=>setShowPass(!showPass),className:"absolute right-3 top-2 text-xs text-slate-400"},showPass?"Ocultar":"Ver")
          )
        ),
        error&&h('div',{className:"bg-rose-50 text-rose-600 text-xs px-3 py-2 rounded-lg"},error),
        resetMsg&&h('div',{className:"bg-emerald-50 text-emerald-700 text-xs px-3 py-2 rounded-lg"},resetMsg),

    const nuevo=actual.includes(clave)?actual.filter(c=>c!==clave):[...actual,clave];
    try{ await usersStorage.updateUser(u.uid,{gradosAsistencia:nuevo}); }
    catch(e){ console.error(e); say("No se pudo actualizar los cursos: "+e.message,true); }

    try{ await usersStorage.resendReset(u.email); registrarAuditoria(usuario,rolActual,"REENVIAR_CLAVE",u.email); say(`Correo de recuperación reenviado a ${u.email}.`); }
    catch(e){ console.error(e); say("No se pudo reenviar el correo.",true); }

  // que no puede recibir el correo de "restablecer contraseña" porque no es un buzón real.
  function esCorreoGenerado(email){
    return (email||"").toLowerCase().endsWith("@"+STUDENT_EMAIL_DOMAIN) || (email||"").toLowerCase().endsWith("@"+STAFF_EMAIL_DOMAIN);

function emptyPersonal(){ const o={}; PERSONAL_FIELD_DEFS.forEach(f=>o[f.id]=""); return o; }

function PersonalFormFields({data,onChange}){
  const ic="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400";
  const filterAlpha=s=>s.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]/g,"").toUpperCase();
  const filterDigits=s=>s.replace(/[^0-9]/g,"");
  return h('div',{className:"grid grid-cols-1 md:grid-cols-2 gap-4"},PERSONAL_FIELD_DEFS.map(f=>{
    let input;
    const v=data[f.id]||"";
    if(f.type==="select") input=h('select',{value:v,onChange:e=>onChange(f.id,e.target.value),className:ic},f.options.map(o=>h('option',{key:o.value,value:o.value},o.label)));
    else if(f.type==="date") input=h('input',{type:"date",value:v,onChange:e=>onChange(f.id,e.target.value),className:ic});
    else if(f.type==="number") input=h('input',{type:"text",inputMode:"numeric",value:v,onChange:e=>onChange(f.id,filterDigits(e.target.value)),className:ic});
    else input=h('input',{type:"text",value:v,inputMode:f.validate==="digits"?"numeric":"text",onChange:e=>onChange(f.id,f.validate==="alpha"?filterAlpha(e.target.value):f.validate==="digits"?filterDigits(e.target.value):e.target.value),className:ic});
    return h('div',{key:f.id},h('label',{className:"block text-xs font-medium text-slate-500 mb-1"},f.label),input);
  }));
}

function MiInformacionModal({onClose,usuario,rol,correo}){
  const [personas,setPersonas]=useState([]);
  const [loadingList,setLoadingList]=useState(true);
  const [data,setData]=useState(emptyPersonal());
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState(""); const [msgErr,setMsgErr]=useState(false);
  const [claveActual,setClaveActual]=useState("");
  const [claveNueva,setClaveNueva]=useState("");
  const [claveNueva2,setClaveNueva2]=useState("");
  const [cambiandoClave,setCambiandoClave]=useState(false);

  useEffect(()=>{
    const unsub=personalStorage.subscribe(list=>{
      setPersonas(list);
      const mio=list.find(p=>(p.correo||"").toLowerCase().trim()===(correo||"").toLowerCase().trim());
      if(mio) setData({...emptyPersonal(),...mio});
      else setData({...emptyPersonal(),nombres:usuario||"",correo:correo||"",anoInformacion:String(new Date().getFullYear())});
      setLoadingList(false);
    },()=>setLoadingList(false));
    return ()=>unsub();
  },[correo]);

  function say(t,isErr=false){setMsg(t);setMsgErr(isErr);setTimeout(()=>setMsg(""),5000);}
  function onChange(id,val){setData(p=>({...p,[id]:val}));}

  async function guardar(){
    if(!data.cedula||!data.nombres){say("La cédula y el nombre son obligatorios.",true);return;}
    setSaving(true);
    try{
      await personalStorage.saveOne(data);
      registrarAuditoria(usuario,rol,"ACTUALIZAR_INFO_PERSONAL",`${data.nombres} (${data.cedula})`);
      say("Información guardada correctamente.");
    }catch(e){ console.error(e); say("No se pudo guardar: "+e.message,true); }
    setSaving(false);
  }

  async function cambiarClave(){
    if(!claveNueva||claveNueva.length<6){say("La nueva contraseña debe tener al menos 6 caracteres.",true);return;}
    if(claveNueva!==claveNueva2){say("Las dos contraseñas nuevas no coinciden.",true);return;}
    setCambiandoClave(true);
    try{
      await auth.currentUser.updatePassword(claveNueva);
      registrarAuditoria(usuario,rol,"CAMBIAR_CONTRASEÑA","");
      say("Contraseña actualizada correctamente.");
      setClaveActual("");setClaveNueva("");setClaveNueva2("");
    }catch(e){
      if(e.code==="auth/requires-recent-login"){
        if(!claveActual.trim()){ say("Por seguridad, escribe tu contraseña ACTUAL arriba y vuelve a intentar.",true); setCambiandoClave(false); return; }
        try{
          const cred=firebase.auth.EmailAuthProvider.credential(correo,claveActual);
          await auth.currentUser.reauthenticateWithCredential(cred);
          await auth.currentUser.updatePassword(claveNueva);
          registrarAuditoria(usuario,rol,"CAMBIAR_CONTRASEÑA","");
          say("Contraseña actualizada correctamente.");
          setClaveActual("");setClaveNueva("");setClaveNueva2("");
        }catch(e2){ console.error(e2); say("Tu contraseña actual no es correcta.",true); }
      } else { console.error(e); say("No se pudo cambiar la contraseña: "+(e.message||""),true); }
    }
    setCambiandoClave(false);
  }

  return h('div',{className:"fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4 py-6 overflow-y-auto"},
    h('div',{className:"bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 my-auto max-h-[90vh] flex flex-col"},
      h('div',{className:"flex items-center justify-between mb-4"},
        h('h2',{className:"text-base font-semibold text-slate-800"},"👤 Mi Información Personal"),
        h('button',{onClick:onClose,className:"text-slate-400 hover:text-slate-600"},h(Icons.X))
      ),
      h('p',{className:"text-xs text-slate-500 mb-4"},"Mantén tu información actualizada cada año. Se guarda con tu correo (",correo,") como identificador."),
      h('div',{className:"bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4"},
        h('p',{className:"text-xs font-semibold text-slate-500 mb-3 uppercase"},"🔑 Cambiar mi contraseña"),
        h('div',{className:"grid grid-cols-1 md:grid-cols-3 gap-3"},
          h('input',{type:"password",placeholder:"Contraseña actual",value:claveActual,onChange:e=>setClaveActual(e.target.value),className:"border border-slate-200 rounded-lg px-3 py-2 text-sm"}),
          h('input',{type:"password",placeholder:"Nueva contraseña",value:claveNueva,onChange:e=>setClaveNueva(e.target.value),className:"border border-slate-200 rounded-lg px-3 py-2 text-sm"}),
          h('input',{type:"password",placeholder:"Repite la nueva",value:claveNueva2,onChange:e=>setClaveNueva2(e.target.value),className:"border border-slate-200 rounded-lg px-3 py-2 text-sm"})
        ),
        h('p',{className:"text-xs text-slate-400 mt-2"},'Si tu usuario fue creado con contraseña = cédula, este es el momento de cambiarla por una propia. Si el sistema te pide la contraseña "actual" y no la sabes, pide al Admin que use "Restablecer cuenta" en Gestión de Usuarios.'),
        h('button',{disabled:cambiandoClave,onClick:cambiarClave,className:"mt-3 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 disabled:opacity-60"},cambiandoClave?"Cambiando...":"Cambiar contraseña")
      ),
      msg&&h('div',{className:`text-sm px-3 py-2 rounded-lg mb-4 ${msgErr?"bg-rose-50 text-rose-600":"bg-emerald-50 text-emerald-700"}`},msg),
      loadingList
        ?h('p',{className:"text-sm text-slate-400 text-center py-8"},"Cargando...")
        :h('div',{className:"overflow-y-auto flex-1"},h(PersonalFormFields,{data,onChange})),
      h('div',{className:"flex justify-end gap-3 mt-4 pt-4 border-t border-slate-100"},
        h('button',{onClick:onClose,className:"px-4 py-2 border border-slate-200 rounded-lg text-sm hover:bg-slate-50"},"Cerrar"),
        h('button',{disabled:saving,onClick:guardar,className:"px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 disabled:opacity-60"},saving?"Guardando...":"Guardar")
      )
    )
  );
}

function PersonalPanel({onClose,usuario,rol}){
  const [personas,setPersonas]=useState([]);
  const [loadingList,setLoadingList]=useState(true);
  const [search,setSearch]=useState("");
  const [filtroTipo,setFiltroTipo]=useState("");
  const [filtroArea,setFiltroArea]=useState("");
  const [filtroAno,setFiltroAno]=useState("");
  const [editando,setEditando]=useState(null);
  const [importing,setImporting]=useState(false);
  const [msg,setMsg]=useState(""); const [msgErr,setMsgErr]=useState(false);
  const fileRef=useRef(null);

  useEffect(()=>{
    const unsub=personalStorage.subscribe(list=>{setPersonas(list);setLoadingList(false);},()=>setLoadingList(false));
    return ()=>unsub();
  },[]);

  function say(t,isErr=false){setMsg(t);setMsgErr(isErr);setTimeout(()=>setMsg(""),5000);}
  function onChange(id,val){setEditando(p=>({...p,[id]:val}));}

  const anosDisponibles=[...new Set(personas.map(p=>p.anoInformacion).filter(Boolean))].sort().reverse();
  const filtrados=personas.filter(p=>{
    if(search.trim()){
      const q=search.toLowerCase();
      if(!((p.nombres||"").toLowerCase().includes(q)||(p.cedula||"").includes(q)||(p.correo||"").toLowerCase().includes(q))) return false;
    }
    if(filtroTipo && p.tipoPersonal!==filtroTipo) return false;
    if(filtroArea && p.areaEducativa!==filtroArea) return false;
    if(filtroAno && p.anoInformacion!==filtroAno) return false;
    return true;
  }).sort((a,b)=>(a.nombres||"").localeCompare(b.nombres||""));

  function hExportarPersonal(){
    if(!filtrados.length){say("No hay registros que coincidan con los filtros actuales.",true);return;}
    const h2=PERSONAL_FIELD_DEFS.map(f=>f.id);
    const rows=filtrados.map(p=>{const r={};h2.forEach(k=>{r[k]=p[k]||"";});return r;});
    const ws=XLSX.utils.json_to_sheet(rows,{header:h2});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Personal");

// Campos de la ficha que realmente aplican a un estudiante dado (excluye Retiro/Deserción
// si no está retirado, y CAUSAS si no hay razón de deserción seleccionada, y el ID interno oculto)
function camposRelevantes(s){
  return FIELD_DEFS.filter(f=>{
    if(f.hidden) return false;
    if(f.section==="desercion" && s.ESTADO!=="RETIRADO") return false;
    if(f.id==="CAUSAS" && !s.RAZON_DESERCION) return false;
    return true;
  });
}
function camposFaltantes(s){
  return camposRelevantes(s).filter(f=>{
    const v=s[f.id];
    if(Array.isArray(v)) return v.length===0;
    return v===undefined||v===null||String(v).trim()==="";
  });
}
function porcentajeCompletitud(s){
  const rel=camposRelevantes(s);
  if(!rel.length) return 100;
  const faltan=camposFaltantes(s).length;
  return Math.round(((rel.length-faltan)/rel.length)*100);
}

    const rows=gradosFiltrados.map(g=>({GRADO:etiquetaGrado(g.gradoBase||g.grado),GRUPO:g.grupo||"",TUTOR:g.tutor||""}));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Grados y Tutores");
    XLSX.writeFile(wb,`grados_tutores_${new Date().toISOString().slice(0,10)}.xlsx`);
    registrarAuditoria(usuario,rolActual,"EXPORTAR_GRADOS",`${rows.length} registro(s)`);
    say(`${rows.length} registro(s) exportado(s).`);
  }

  async function handleImport(file){
    if(!file) return;
    setImporting(true);
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      let ok=0, saltados=0;
      for(const row of rows){
        const claves=Object.keys(row).reduce((m,k)=>{m[k.trim().toLowerCase()]=row[k];return m;},{});
        const gradoRaw=String(claves["grado"]??"").trim();
        const grupo=String(claves["grupo"]??"").trim();
        const tutor=String(claves["tutor"]??claves["tutor(a)"]??claves["director de grupo"]??"").trim();
        if(!gradoRaw){ saltados++; continue; }
        // Acepta tanto el código ("6") como la etiqueta completa ("6 - Sexto")
        const grado = GRADO_OPTS.find(o=>o.value===gradoRaw||o.label===gradoRaw||o.label.split(" - ")[1]?.toLowerCase()===gradoRaw.toLowerCase())?.value;
        if(!grado){ saltados++; continue; }
        const id=grado+(grupo?"-"+grupo:"");
        await gradosStorage.saveOne(id,tutor,grado,grupo);
        ok++;
      }
      registrarAuditoria(usuario,rolActual,"IMPORTAR_GRADOS",`${ok} importado(s), ${saltados} saltado(s)`);
      say(`${ok} registro(s) importado(s)${saltados?`, ${saltados} saltado(s) (grado no reconocido)`:""}.`,saltados>0&&ok===0);
    }catch(e){ console.error(e); say("No se pudo importar el archivo: "+e.message,true); }
    setImporting(false);
    if(fileRef.current) fileRef.current.value="";
  }

  async function guardar(){
    if(!form.grado){say("Selecciona el grado.",true);return;}
    const id=form.grado+(form.grupo?"-"+form.grupo:"");
    setSaving(true);
    try{
      await gradosStorage.saveOne(id,form.tutor,form.grado,form.grupo);
      registrarAuditoria(usuario,rolActual,editandoId?"EDITAR_GRADO":"CREAR_GRADO",`${id} (tutor: ${form.tutor||"sin asignar"})`);
      say("Grado/grupo guardado.");
      setForm({grado:"",grupo:"",tutor:""});setEditandoId(null);
    }
    catch(e){ console.error(e); say("No se pudo guardar.",true); }
    setSaving(false);
  }
  async function eliminar(id){
    if(!confirm(`¿Eliminar "${id}"?`))return;
    try{ await gradosStorage.deleteOne(id); registrarAuditoria(usuario,rolActual,"ELIMINAR_GRADO",id); say("Eliminado."); }
    catch(e){ console.error(e); say("No se pudo eliminar.",true); }
  }

  return h('div',{className:"fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4 py-6 overflow-y-auto"},
    h('div',{className:"bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 my-auto max-h-[90vh] flex flex-col"},
      h('div',{className:"flex items-center justify-between mb-5"},
        h('h2',{className:"text-base font-semibold text-slate-800"},"🎓 Grados y Tutores (",gradosFiltrados.length!==grados.length?`${gradosFiltrados.length} de ${grados.length}`:grados.length,")"),
        h('button',{onClick:onClose,className:"text-slate-400 hover:text-slate-600"},h(Icons.X))

      h('div',{className:"flex flex-wrap gap-2 mb-4"},

        h('select',{value:filtroGrado,onChange:e=>setFiltroGrado(e.target.value),className:"border border-slate-200 rounded-lg px-3 py-2 text-sm"},h('option',{value:""},"Todos los grados"),GRADO_OPTS.map(g=>h('option',{key:g.value,value:g.value},g.label))),
        h('button',{onClick:hExportar,className:"px-3 py-2 border border-indigo-200 text-indigo-700 rounded-lg text-sm hover:bg-indigo-50 flex items-center gap-1"},h(Icons.Download),"Exportar"),
        h('button',{disabled:importing,onClick:()=>fileRef.current?.click(),className:"px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm hover:bg-emerald-700 disabled:opacity-60"},importing?"Importando...":"📥 Importar Excel"),
        h('input',{ref:fileRef,type:"file",accept:".xlsx,.xls",className:"hidden",onChange:e=>handleImport(e.target.files?.[0])})
      ),
      h('div',{className:"bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4"},
        h('div',{className:"grid grid-cols-1 md:grid-cols-3 gap-3"},
          h('select',{value:form.grado,onChange:e=>setForm({...form,grado:e.target.value}),className:ic},h('option',{value:""},"— Grado —"),GRADO_OPTS.map(g=>h('option',{key:g.value,value:g.value},g.label))),
          h('select',{value:form.grupo,onChange:e=>setForm({...form,grupo:e.target.value}),className:ic},GRUPO_OPTS.map(g=>h('option',{key:g.value,value:g.value},g.label||"Grupo"))),
          h('input',{placeholder:"Tutor(a)",value:form.tutor,onChange:e=>setForm({...form,tutor:e.target.value}),className:ic})
        ),
        h('button',{disabled:saving,onClick:guardar,className:"mt-3 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 disabled:opacity-60"},saving?"Guardando...":editandoId?"Actualizar":"Guardar")
      ),
      msg&&h('div',{className:`text-sm px-3 py-2 rounded-lg mb-4 ${msgErr?"bg-rose-50 text-rose-600":"bg-emerald-50 text-emerald-700"}`},msg),
      h('div',{className:"overflow-y-auto flex-1 border border-slate-200 rounded-lg"},
        loadingList?h('p',{className:"text-sm text-slate-400 text-center py-8"},"Cargando..."):
        grados.length===0?h('p',{className:"text-sm text-slate-400 text-center py-8"},"No hay grados registrados aún."):
        gradosFiltrados.length===0?h('p',{className:"text-sm text-slate-400 text-center py-8"},"Ningún grado coincide con la búsqueda/filtro."):
        h('table',{className:"w-full text-sm"},
          h('thead',{className:"bg-slate-50 text-slate-500 text-xs uppercase sticky top-0"},h('tr',null,h('th',{className:"text-left px-3 py-2"},"Grado"),h('th',{className:"text-left px-3 py-2"},"Grupo"),h('th',{className:"text-left px-3 py-2"},"Tutor(a)"),h('th',{className:"text-left px-3 py-2"},"Acciones"))),
          h('tbody',null,gradosFiltrados.map(g=>h('tr',{key:g.grado,className:"border-t border-slate-100"},
            h('td',{className:"px-3 py-2"},etiquetaGrado(g.gradoBase||g.grado)),
            h('td',{className:"px-3 py-2"},g.grupo||h('span',{className:"text-slate-300"},"—")),
            h('td',{className:"px-3 py-2"},g.tutor||h('span',{className:"text-slate-400"},"Sin asignar")),
            h('td',{className:"px-3 py-2"},
              h('button',{onClick:()=>{
                const gradoValido=GRADO_OPTS.some(o=>o.value===(g.gradoBase||""));
                if(!gradoValido) say(`⚠️ "${g.grado}" es un registro antiguo sin grado válido. Selecciona el grado correcto del desplegable y guarda de nuevo (esto reemplazará el registro viejo).`,true);
                setForm({grado:gradoValido?g.gradoBase:"",grupo:g.grupo||"",tutor:g.tutor||""});
                setEditandoId(gradoValido?g.grado:null);
              },className:"text-xs px-2 py-1 border border-slate-200 rounded hover:bg-slate-50 mr-2"},"Editar"),
              h('button',{onClick:()=>eliminar(g.grado),className:"text-xs px-2 py-1 border border-rose-200 text-rose-600 rounded hover:bg-rose-50"},"Eliminar")
            )
          )))
        )
      ),
      h('div',{className:"flex justify-end mt-4"},h('button',{onClick:onClose,className:"px-4 py-2 border border-slate-200 rounded-lg text-sm hover:bg-slate-50"},"Cerrar"))

// MÓDULO DIRECTIVA: configuración académica base (períodos, áreas, asignaturas,
// asignaturas por grado, escala de valoración, criterios de convivencia, propósitos).
// Todo lo demás (carga académica, boletines, promoción) se apoya en esta configuración.
// ═══════════════════════════════════════════

// Sub-sección genérica de lista simple (nombre + campos extra opcionales)
function SeccionCrudSimple({storage,campos,titulo,ayuda,itemLabel,extraCols,tituloImpresion}){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [form,setForm]=useState(()=>{const o={};campos.forEach(c=>o[c.id]=c.default!==undefined?c.default:"");return o;});
  const [editId,setEditId]=useState(null);
  const [msg,setMsg]=useState(""); const [msgErr,setMsgErr]=useState(false);
  const [importing,setImporting]=useState(false);
  const [busqueda,setBusqueda]=useState("");
  const fileRef=useRef(null);
  const sayRef=useRef(null);
  const ic="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400";

  useEffect(()=>{ const unsub=storage.subscribe(list=>{setItems(list);setLoading(false);},()=>setLoading(false)); return ()=>unsub(); },[]);
  function say(t,err=false,dur){setMsg(t);setMsgErr(err);if(sayRef.current)clearTimeout(sayRef.current);sayRef.current=setTimeout(()=>setMsg(""),dur||(t.length>60?9000:3500));}
  function limpiar(){const o={};campos.forEach(c=>o[c.id]=c.default!==undefined?c.default:"");setForm(o);setEditId(null);}
  const etiquetaCampo=(c,val)=>c.type==="select"?((c.options||[]).find(o=>o.value===val)?.label||val||""):(val||"");
  // Para campos calculados (ej. Nivel Educativo, que sale solo del grado) no hay valor
  // guardado -- se calcula al vuelo con c.compute(item). Se usa en tabla/exportar/copiar/imprimir.
  const valorMostrado=(c,it)=>c.type==="computed"?(c.compute?c.compute(it):""):etiquetaCampo(c,it[c.id]??c.default);
  const normBusqueda=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
  const qBusqueda=normBusqueda(busqueda);
  const itemsFiltrados=qBusqueda?items.filter(it=>campos.some(c=>normBusqueda(valorMostrado(c,it)).includes(qBusqueda))):items;

  async function guardar(){
    const oblig=campos.filter(c=>c.requerido!==false);
    if(oblig.some(c=>!String(form[c.id]||"").trim())){say(`Completa: ${oblig.map(c=>c.label).join(", ")}.`,true);return;}
    try{
      await storage.saveOne(editId?{...form,_id:editId}:form);
      say(editId?"Actualizado.":"Agregado.");
      limpiar();
    }catch(e){ console.error(e); say("No se pudo guardar: "+e.message,true); }
  }
  async function borrar(id){
    if(!window.confirm("¿Eliminar este registro?")) return;
    try{ await storage.deleteOne(id); say("Eliminado."); }
    catch(e){ console.error(e); say("No se pudo eliminar.",true); }
  }
  function editar(it){
    const base=Object.fromEntries(campos.map(c=>[c.id,it[c.id]??(c.default!==undefined?c.default:"")]));
    campos.filter(c=>c.type==="select"&&c.buscable).forEach(c=>{ base[`_txt_${c.id}`]=(c.options||[]).find(o=>o.value===base[c.id])?.label||""; });
    setForm(base);
    setEditId(it._id);
  }

  // Exportar a Excel: una columna por campo, mostrando la etiqueta (no el id interno) en los select.
  function hExportar(){
    if(!itemsFiltrados.length){say("No hay nada que exportar.",true);return;}
    const rows=itemsFiltrados.map(it=>Object.fromEntries(campos.map(c=>[c.label,valorMostrado(c,it)])));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,itemLabel);
    XLSX.writeFile(wb,`${itemLabel.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // Copiar al portapapeles en formato de columnas (se puede pegar directo en Excel/Word)
  async function hCopiar(){
    if(!itemsFiltrados.length){say("No hay nada que copiar.",true);return;}
    const encabezado=campos.map(c=>c.label).join("\t");
    const filas=itemsFiltrados.map(it=>campos.map(c=>valorMostrado(c,it)).join("\t"));
    const texto=[encabezado,...filas].join("\n");
    try{ await navigator.clipboard.writeText(texto); say(`${items.length} fila(s) copiada(s). Pégalas donde quieras (Ctrl+V).`); }
    catch(e){ console.error(e); say("No se pudo copiar (el navegador bloqueó el acceso al portapapeles).",true); }
  }

  // Imprimir la lista completa en una pestaña nueva, con el encabezado del colegio
  function hImprimir(){
    if(!itemsFiltrados.length){say("No hay nada que imprimir.",true);return;}
    const filas=itemsFiltrados.map((it,i)=>`<tr><td>${i+1}</td>${campos.map(c=>`<td class="${c.type==='select'?'':'tn'}">${valorMostrado(c,it)}</td>`).join("")}</tr>`).join("");
    const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>${tituloImpresion||itemLabel}</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:18px;font-size:12px}
@media print{button{display:none!important}}
h1{background:#1F4E79;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;margin:0}
.sub{background:#BDD7EE;color:#1F4E79;text-align:center;padding:6px;font-size:11px;font-weight:700;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #555;padding:6px}
th{background:#1F4E79;color:#fff;text-align:left}
.tn{text-align:left!important}
h1,.sub{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style></head><body>
<button onclick="window.print()" style="margin-bottom:14px;padding:7px 18px;background:#4f46e5;color:#fff;border:none;border-radius:7px;cursor:pointer;">🖨️ Imprimir / Guardar PDF</button>
${lhHtml()}
<h1>IED SARID ARTETA DE VÁSQUEZ — "INEDISAV CONSTRUYENDO CALIDAD"</h1>
<div class="sub">${(tituloImpresion||itemLabel).toUpperCase()}</div>
<table><thead><tr><th style="width:35px">N°</th>${campos.map(c=>`<th>${c.label}</th>`).join("")}</tr></thead><tbody>${filas}</tbody></table>
${lfHtml()}
</body></html>`;
    dlHtml(html,`${itemLabel.replace(/\s+/g,"_")}.html`);
  }

  // Importar desde Excel: hace match de columnas por nombre (sin importar mayúsculas/tildes)
  // contra la etiqueta o el id de cada campo. Los campos tipo "select" se resuelven contra
  // sus opciones (por etiqueta, o directo por el id/value si ya coincide).
  async function handleImport(file){
    if(!file) return;
    setImporting(true);
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
      // Solo los campos de texto/select OBLIGATORIOS identifican al registro (su "clave").
      // Los opcionales (como Abreviatura) y los numéricos/fecha NO se usan para comparar,
      // porque si el Excel no trae esa columna, todo quedaría vacío y rompería la detección.
      const camposClave=campos.filter(c=>c.type!=="number"&&c.type!=="date"&&c.type!=="computed"&&c.requerido!==false);
      const itemsLocal=[...items]; // copia mutable: si el mismo archivo trae la fila repetida, la detecta también
      let ok=0, actualizados=0, saltados=0;
      for(const row of rows){
        const claves={}; Object.keys(row).forEach(k=>{claves[norm(k)]=row[k];});
        const data={};
        let faltaObligatorio=false;
        for(const c of campos){
          if(c.type==="computed") continue; // se calcula solo, no se importa ni se guarda
          let raw=claves[norm(c.label)];
          if(raw===undefined) raw=claves[norm(c.id)];
          raw=String(raw??"").trim();
          if(c.maxLength) raw=raw.slice(0,c.maxLength);
          if(c.type==="select"&&raw){
            // 1) coincidencia exacta con la etiqueta completa, 2) coincidencia con la etiqueta
            // sin la parte entre paréntesis (ej. "Química" contra "Química (Ciencias Naturales)"),
            // 3) coincidencia directa con el value.
            const opt=(c.options||[]).find(o=>norm(o.label)===norm(raw))
                    || (c.options||[]).find(o=>norm(o.label.split("(")[0])===norm(raw))
                    || (c.options||[]).find(o=>o.value===raw);
            raw=opt?opt.value:raw;
          }
          if(!raw && c.requerido!==false) faltaObligatorio=true;
          data[c.id]=raw;
        }
        if(faltaObligatorio){ saltados++; continue; }
        const existente=camposClave.length?itemsLocal.find(it=>camposClave.every(c=>norm(it[c.id])===norm(data[c.id]))):null;
        if(existente){
          await storage.saveOne({...data,_id:existente._id});
          Object.assign(existente,data);
          actualizados++;
        }else{
          const nuevoId=await storage.saveOne(data);
          itemsLocal.push({...data,_id:nuevoId});
          ok++;
        }
      }
      say(`${ok} nuevo(s), ${actualizados} actualizado(s) (ya existían)${saltados?`, ${saltados} saltado(s) (faltaba un dato obligatorio)`:""}.`, saltados>0&&ok===0&&actualizados===0, 12000);
    }catch(e){ console.error(e); say("No se pudo importar el archivo: "+e.message,true); }
    setImporting(false);
    if(fileRef.current) fileRef.current.value="";
  }

  return h('div',{className:"space-y-4"},
    ayuda&&h('p',{className:"text-xs text-slate-500"},ayuda),
    msg&&h('div',{className:`rounded-lg px-3 py-2 text-xs ${msgErr?"bg-rose-50 text-rose-700":"bg-emerald-50 text-emerald-700"}`},msg),
    h('div',{className:"flex flex-wrap gap-2 items-center"},
      h('input',{placeholder:"🔎 Buscar...",value:busqueda,onChange:e=>setBusqueda(e.target.value),className:"px-3 py-1.5 border border-slate-200 rounded-lg text-xs min-w-[160px]"}),
      h('button',{disabled:importing,onClick:()=>fileRef.current?.click(),className:"px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-medium hover:bg-emerald-700 disabled:opacity-60"},importing?"Importando...":"📥 Importar Excel"),
      h('input',{ref:fileRef,type:"file",accept:".xlsx,.xls",className:"hidden",onChange:e=>handleImport(e.target.files?.[0])}),
      h('button',{onClick:hExportar,className:"px-3 py-1.5 border border-indigo-200 text-indigo-700 rounded-lg text-xs font-medium hover:bg-indigo-50"},"⬇️ Exportar Excel"),
      h('button',{onClick:hCopiar,className:"px-3 py-1.5 border border-slate-200 text-slate-700 rounded-lg text-xs font-medium hover:bg-slate-50"},"📋 Copiar"),
      h('button',{onClick:hImprimir,className:"px-3 py-1.5 border border-slate-200 text-slate-700 rounded-lg text-xs font-medium hover:bg-slate-50"},"🖨️ Imprimir"),
      qBusqueda&&h('span',{className:"text-xs text-slate-400"},`${itemsFiltrados.length} de ${items.length}`)
    ),
    h('div',{className:"bg-slate-50 border border-slate-200 rounded-xl p-3"},
      h('div',{className:"grid gap-2",style:{gridTemplateColumns:`repeat(${Math.min(campos.filter(c=>c.type!=="computed").length,4)}, minmax(0,1fr))`}},
        campos.filter(c=>c.type!=="computed").map(c=>c.type==="select"
          ?(c.buscable
              ?h('div',{key:c.id},
                  h('input',{
                    list:`dl_${c.id}`,
                    placeholder:`🔎 ${c.label}`,
                    value: form[`_txt_${c.id}`] ?? ((c.options||[]).find(o=>o.value===form[c.id])?.label || ""),
                    onChange:e=>{
                      const texto=e.target.value;
                      const opt=(c.options||[]).find(o=>o.label===texto);
                      setForm(f=>({...f,[c.id]:opt?opt.value:"",[`_txt_${c.id}`]:texto}));
                    },
                    className:ic
                  }),
                  h('datalist',{id:`dl_${c.id}`},(c.options||[]).map(o=>h('option',{key:o.value,value:o.label})))
                )
              :h('select',{key:c.id,value:form[c.id],onChange:e=>setForm({...form,[c.id]:e.target.value}),className:ic},h('option',{value:""},c.label),(c.options||[]).map(o=>h('option',{key:o.value,value:o.value},o.label))))
          :h('input',{key:c.id,type:c.type||"text",placeholder:c.maxLength?`${c.label} (máx ${c.maxLength})`:c.label,maxLength:c.maxLength||undefined,value:form[c.id],onChange:e=>setForm({...form,[c.id]:c.maxLength?e.target.value.slice(0,c.maxLength):e.target.value}),className:ic})
        )
      ),
      h('div',{className:"flex gap-2 mt-2"},
        h('button',{onClick:guardar,className:"px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700"},editId?"Guardar cambios":`+ Agregar ${itemLabel}`),
        editId&&h('button',{onClick:limpiar,className:"px-3 py-2 border border-slate-200 rounded-lg text-sm hover:bg-slate-50"},"Cancelar edición")
      )
    ),
    h('div',{className:"border border-slate-200 rounded-lg overflow-hidden"},
      loading?h('p',{className:"text-sm text-slate-400 text-center py-6"},"Cargando..."):
      items.length===0?h('p',{className:"text-sm text-slate-400 text-center py-6"},`No hay ${itemLabel}s registrados aún.`):

        asistenciaStorage.getResumen(grado,grupoEfectivo),
        notasStorage.getTodosPeriodos(grado,grupoEfectivo)

      setResumenAsist(dias);
      setResumenNotas(periodos);

  const activos=lista.filter(s=>s.ESTADO!=="RETIRADO");

    (resumenAsist||[]).forEach(dia=>{ const v=dia.registros?.[estId]; if(v&&c[v]!==undefined) c[v]++; });

// PORTAL DE ESTUDIANTES: el estudiante ve/edita solo SU ficha,
// y solo los campos de caracterización (no identidad ni historial institucional).
// ═══════════════════════════════════════════
function EstudiantePortal({session,onLogout}){
  const [myStudent,setMyStudent]=useState(null);
  const [loading,setLoading]=useState(true);
  const [formData,setFormData]=useState(null);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState(""); const [msgErr,setMsgErr]=useState(false);

  useEffect(()=>{
    if(!session?.uid){ setLoading(false); return; }
    const unsub=studentsStorage.subscribeOwn(session.uid,
      (doc)=>{ setMyStudent(doc); setFormData(doc?{...doc}:null); setLoading(false); },
      ()=>{ setLoading(false); setMsg("No se pudo cargar tu información."); setMsgErr(true); }
    );
    return ()=>unsub();
  },[session?.uid]);

  function say(t,err=false){ setMsg(t); setMsgErr(err); setTimeout(()=>setMsg(""),4000); }
  function hChange(fid,val){ setFormData(p=>({...p,[fid]:val})); }

  async function hSave(){
    if(!myStudent) return;
    for(const fid of STUDENT_EDITABLE_FIELD_IDS){
      const f=FIELD_DEFS.find(x=>x.id===fid); const v=formData[fid];
      if(!v) continue;
      if(f.validate==="alpha" && !/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]+$/.test(v)){say(`"${f.label}" solo puede contener letras.`,true);return;}
      if(f.validate==="digits" && !/^[0-9]+$/.test(v)){say(`"${f.label}" solo puede contener números.`,true);return;}
    }
    setSaving(true);
    try{
      const patch={}; STUDENT_EDITABLE_FIELD_IDS.forEach(fid=>{patch[fid]=formData[fid]||"";});
      patch.ACTUALIZADO_POR_ESTUDIANTE_EN=new Date().toISOString();
      await studentsStorage.updateFields(myStudent._id,patch);
      registrarAuditoria(session.nombre||session.email, "estudiante", "ESTUDIANTE_ACTUALIZO_PERFIL", `${myStudent.NOMBRE1||""} ${myStudent.APELLIDO1||""}`);
      say("Información actualizada. ¡Gracias!");
    }catch(e){ console.error(e); say("No se pudo guardar. Intenta de nuevo.",true); }
    setSaving(false);
  }

  if(loading) return h('div',{className:"min-h-screen flex items-center justify-center text-indigo-600"},h(Icons.Spin));
  if(!myStudent) return h('div',{className:"min-h-screen flex items-center justify-center flex-col gap-4 text-center px-4"},
    h('p',{className:"text-slate-600"},"No encontramos una ficha asociada a tu cuenta. Habla con la coordinación del colegio."),
    h('button',{onClick:onLogout,className:"px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm"},"Salir")
  );

  const nombreCompleto=[myStudent.NOMBRE1,myStudent.NOMBRE2,myStudent.APELLIDO1,myStudent.APELLIDO2].filter(Boolean).join(" ");
  const gradoLabel=(GRADO_OPTS.find(g=>g.value===myStudent.GRADO)?.label||myStudent.GRADO||"").split(" - ")[1]||myStudent.GRADO;

  return h('div',{className:"min-h-screen bg-slate-50"},
    h('div',{className:"bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-4 md:px-6 py-4 flex items-center justify-between"},
      h('div',null,
        h('div',{className:"font-bold text-lg"},"Mi Información — INEDISAV"),
        h('div',{className:"text-sm text-white/80"},`${nombreCompleto} · ${gradoLabel} ${myStudent.GRUPO||""}`.trim())
      ),
      h('button',{onClick:onLogout,className:"px-3 py-1.5 rounded-lg text-sm font-medium bg-white/10 hover:bg-white/20 border border-white/30"},"Salir")
    ),
    h('div',{className:"max-w-3xl mx-auto p-4 md:p-6 space-y-4"},
      h('div',{className:"bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-4 py-3 text-sm"},
        "Revisa y actualiza tu información cada año. Los datos de matrícula (documento, grado, grupo, estado) los maneja la coordinación del colegio y no se pueden editar aquí."
      ),
      msg&&h('div',{className:`rounded-lg px-4 py-3 text-sm ${msgErr?"bg-rose-50 text-rose-700 border border-rose-200":"bg-emerald-50 text-emerald-700 border border-emerald-200"}`},msg),
      STUDENT_EDITABLE_SECTION_IDS.map(secId=>{
        const secLabel=SECTIONS.find(s=>s.id===secId)?.label||secId;
        const camposSec=FIELD_DEFS.filter(f=>f.section===secId && !STUDENT_EXCLUDED_FIELD_IDS.includes(f.id) && !f.comisionField && !f.adminOnly);
        if(!camposSec.length) return null;
        return h('div',{key:secId,className:"bg-white rounded-xl border border-slate-200 p-4 md:p-5"},
          h('h3',{className:"font-semibold text-slate-800 mb-3"},secLabel),
          h('div',{className:"grid grid-cols-1 md:grid-cols-2 gap-3"},
            camposSec.map(f=>h(FieldRenderer,{key:f.id,field:f,value:formData[f.id],onChange:v=>hChange(f.id,v),parentValue:formData.RAZON_DESERCION}))
          )
        );
      }),
      h('div',{className:"flex justify-end pb-8"},
        h('button',{onClick:hSave,disabled:saving,className:"px-6 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50"},saving?"Guardando...":"Guardar cambios")
      )
    )
  );
}

  function validateForm(data){

      const v=data[f.id];
      if(!v) continue;
      if(f.validate==="alpha" && !/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]+$/.test(v)) return `"${f.label}" solo puede contener letras.`;
      if(f.validate==="digits" && !/^[0-9]+$/.test(v)) return `"${f.label}" solo puede contener números.`;
      if(f.validate==="alnum" && !/^[A-Za-z0-9]+$/.test(v)) return `"${f.label}" solo puede contener letras y números.`;
      if(f.type==="number" && v!=="" && !/^[0-9]+$/.test(String(v))) return `"${f.label}" solo puede contener números.`;
    }
    return null;

  // Recorre todos los estudiantes ya guardados y corrige mayúsculas en nombres/documentos
  // y valores de listas desplegables (Ruta, Transportador, etc.) que hayan quedado con
  // distinta capitalización por importaciones anteriores. Solo reescribe los que cambian.
  // Migración puntual: el código de grado "Jardín" pasó de -2 a -1.
  // Actualiza estudiantes, la configuración de grados/grupos (tutores) y los docentes
  // que tengan asignado el grado -2, para que todo quede consistente con el nuevo código.
  async function hMigrarGradoJardin(){
    if(!window.confirm('Esto va a cambiar el código de grado "-2" (Jardín) por "-1" en todos los estudiantes, en la configuración de grados/grupos y en los docentes asignados a ese grado. ¿Continuar?')) return;
    setImporting(true);
    try{
      let totalEst=0, totalGrupos=0, totalDocentes=0;

      // 1) Estudiantes
      const afectados=students.filter(s=>s.GRADO==="-2");
      if(afectados.length){
        await studentsStorage.saveMany(afectados.map(s=>({...s,GRADO:"-1"})));
        totalEst=afectados.length;
      }

      if(db){
        // 2) Configuración de grados/grupos (tutores)
        const gradosSnap=await db.collection(GRADOS_COLLECTION).where("gradoBase","==","-2").get();
        for(const docSnap of gradosSnap.docs){
          const d=docSnap.data();
          const nuevoId="-1"+(d.grupo?"-"+d.grupo:"");
          await db.collection(GRADOS_COLLECTION).doc(nuevoId).set({tutor:d.tutor||"",gradoBase:"-1",grupo:d.grupo||""});
          await db.collection(GRADOS_COLLECTION).doc(docSnap.id).delete();
          totalGrupos++;
        }
        // 3) Docentes/personal con ese grado asignado
        const usuariosSnap=await db.collection(USERS_COLLECTION).where("grado","==","-2").get();
        for(const docSnap of usuariosSnap.docs){
          await db.collection(USERS_COLLECTION).doc(docSnap.id).update({grado:"-1"});
          totalDocentes++;
        }
      }

      showSt(`Migración completa: ${totalEst} estudiante(s), ${totalGrupos} grado/grupo(s), ${totalDocentes} docente(s) actualizados.`);
    }catch(e){ console.error(e); showSt("No se pudo completar la migración.",true); }
    setImporting(false);
  }

  async function hNormalize(){
    if(!window.confirm("Esto revisará todos los estudiantes y el personal, y corregirá mayúsculas y valores de listas (rutas, transportador, sexo, etc.) desactualizados. ¿Continuar?")) return;
    setImporting(true);
    try{
      const changed=[];
      students.forEach(s=>{
        let diff=false;const norm={...s};
        FIELD_DEFS.forEach(f=>{
          const cur=s[f.id];
          if(cur==null||cur==="") return;
          const nv=normalizeFieldValue(f,cur);
          if(nv!==cur){norm[f.id]=nv;diff=true;}
        });
        if(diff) changed.push(norm);
      });
      if(changed.length) await studentsStorage.saveMany(changed);

      // También corrige el personal (ej. campo Sexo) usando la misma lógica.
      let changedPersonal=0;
      if(db){
        const snap=await db.collection(PERSONAL_COLLECTION).get();
        const personChanged=[];
        snap.docs.forEach(docSnap=>{
          const p={...docSnap.data(),_id:docSnap.id};
          let diff=false;const norm={...p};
          PERSONAL_FIELD_DEFS.forEach(f=>{
            const cur=p[f.id];
            if(cur==null||cur==="") return;
            const nv=normalizeFieldValue(f,cur);
            if(nv!==cur){norm[f.id]=nv;diff=true;}
          });
          if(diff) personChanged.push(norm);
        });
        if(personChanged.length){ await personalStorage.saveMany(personChanged); changedPersonal=personChanged.length; }
      }

      if(!changed.length && !changedPersonal){showSt("Todos los registros ya estaban normalizados.");setImporting(false);return;}
      showSt(`${changed.length} estudiante(s) y ${changedPersonal} funcionario(s) corregido(s) (mayúsculas y listas).`);

    setImporting(false);
  }

  async function hCrearUsuariosEstudiantes(){
    const candidatos=filtered.filter(s=>s.ESTADO!=="RETIRADO");
    const sinCuenta=candidatos.filter(s=>!s.AUTH_UID).length;
    if(!sinCuenta){showSt("Todos los estudiantes de este filtro ya tienen cuenta.");return;}
    if(!window.confirm(`Se crearán cuentas para ${sinCuenta} estudiante(s) sin cuenta (según el filtro actual: año/grado/grupo/estado). El usuario será inicial+apellido+documento+"e" y la contraseña el número de documento. Con muchos estudiantes puede tardar varios minutos (va despacio a propósito para no chocar con el límite de Firebase). ¿Continuar?`)) return;
    setImporting(true);
    try{
      const r=await crearUsuariosEstudiantes(candidatos);
      let msg=`${r.creados} cuenta(s) creada(s), ${r.saltados} ya tenían cuenta o datos incompletos.`;
      if(r.errores.length){
        msg+=` ${r.errores.length} con error.`;
        const motivos=r.errores.slice(0,3).map(e=>`${e.estudiante}: ${e.motivo}`).join(" | ");
        msg+=` Ej: ${motivos}`;
        console.warn("Errores creando usuarios de estudiante:", r.errores);
      }
      if(r.limitados>0){ msg+=` Firebase frenó la creación varias veces por límite de velocidad; si quedaron pendientes, espera 2-3 minutos y vuelve a correr esta misma opción (retoma donde se quedó).`; }
      showSt(msg, r.errores.length>0 && r.creados===0);
    }catch(e){ console.error(e); showSt("No se pudo completar la creación de cuentas.",true); }
    setImporting(false);
  }

  function hImport(e){
    const file=e.target.files?.[0];if(!file)return;setImporting(true);
    const reader=new FileReader();
    reader.onload=async(evt)=>{try{
      const wb=XLSX.read(new Uint8Array(evt.target.result),{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const keyOf=(t,n,a)=>`${(t||"").trim()}|${(n||"").trim()}|${(a||"").trim()}`;
      const existing=new Set(students.filter(s=>(s.NRO_DOCUMENTO||"").trim()).map(s=>keyOf(s.TIPO_DOCUMENTO,s.NRO_DOCUMENTO,s.ANNO_INF)));
      const seen=new Set();const imported=[],rejected=[];
      rows.forEach((row,idx)=>{
        const obj=emptyStudent();Object.keys(row).forEach(k=>{const fid=FIELD_KEY_MAP[normalizeKey(k)];if(!fid)return;const field=FIELD_DEFS.find(f=>f.id===fid);obj[fid]=field?normalizeFieldValue(field,row[k]):String(row[k]??"").trim();});if(!obj.ESTADO)obj.ESTADO="MATRICULADO";
        const doc=(obj.NRO_DOCUMENTO||"").trim();
        const nombre=[obj.NOMBRE1,obj.NOMBRE2,obj.APELLIDO1,obj.APELLIDO2].filter(Boolean).join(" ")||`Fila ${idx+2}`;
        if(!doc&&!obj.NOMBRE1&&!obj.APELLIDO1){rejected.push({nombre,doc:"—",razon:"Fila sin documento ni nombre"});return;}
        if(doc){const key=keyOf(obj.TIPO_DOCUMENTO,doc,obj.ANNO_INF);if(existing.has(key)){rejected.push({nombre,doc,razon:"Ya existe en la base de datos (mismo año)"});return;}if(seen.has(key)){rejected.push({nombre,doc,razon:"Duplicado dentro del archivo Excel"});return;}seen.add(key);}
        obj._id=`${Date.now()}_${Math.random().toString(36).slice(2)}`;imported.push(obj);
      });
      if(imported.length){await studentsStorage.saveMany(imported);}
      setImportResult({imported:imported.length,rejected});
      showSt(imported.length?`${imported.length} importado(s). ${rejected.length} no importado(s).`:"No se importó ningún registro.",rejected.length>0&&imported.length===0);
    }catch(err){console.error(err);showSt("No se pudo leer el archivo.",true);}finally{setImporting(false);}};
    reader.onerror=()=>{setImporting(false);showSt("Error al leer el archivo.",true);};reader.readAsArrayBuffer(file);e.target.value="";
  }

                      h('td',{className:"px-3 py-2"},r.nombre),
                      h('td',{className:"px-3 py-2 whitespace-nowrap"},r.doc),
                      h('td',{className:"px-3 py-2"},h('span',{className:`px-2 py-0.5 rounded-full text-xs font-medium ${r.razon.includes("base de datos")?"bg-amber-100 text-amber-700":r.razon.includes("Excel")?"bg-rose-100 text-rose-700":"bg-slate-100 text-slate-600"}`},r.razon))

                  h('button',{onClick:()=>setImportResult(null),className:"ml-auto px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700"},"Cerrar")

              h('button',{onClick:()=>setView("list"),className:"text-slate-400 hover:text-slate-600"},h(Icons.X))
            ),
            h('div',{className:"flex gap-1 overflow-x-auto pb-1"},SECTIONS.map((sec,i)=>{

            })),

              SECTIONS[activeSection].id==="desercion"&&formData.ESTADO!=="RETIRADO"

                h('button',{disabled:activeSection===0,onClick:()=>setActiveSection(s=>s-1),className:"flex items-center gap-1 px-3 py-2 border rounded-lg text-sm disabled:opacity-40"},h(Icons.ChevL),"Anterior"),

          view==="asistencia"&&h(AsistenciaInformesView,{students,role,usuario:session.nombre||session.email,gradoFijo:"",grupoFijo:"",tipo:"asistencia"}),

}

// Detecta si esta copia del sitio es la "beta" de pruebas (por el nombre del
// repositorio/URL), y en ese caso muestra una franja roja fija arriba de TODO
// (incluso antes de iniciar sesión), para que nadie la confunda con el sitio real.
const ES_BETA = /beta/i.test(window.location.hostname) || /beta/i.test(window.location.pathname);
function AppRoot(){
  return h(React.Fragment, null,
    ES_BETA && h('div',{style:{position:"fixed",top:0,left:0,right:0,zIndex:9999,background:"#dc2626",color:"#fff",textAlign:"center",padding:"7px 8px",fontSize:"12px",fontWeight:700,boxShadow:"0 2px 6px rgba(0,0,0,.25)"}},
      "🧪 SITIO DE PRUEBAS (BETA) — No lo uses para el trabajo diario real. Para eso, usa el sitio oficial del colegio."
    ),
    h('div',{style:ES_BETA?{paddingTop:"34px"}:{}}, h(App))
  );
}

window.addEventListener('DOMContentLoaded', function() {
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppRoot));
});
</script>
